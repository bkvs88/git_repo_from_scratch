[pytest]
# The application modules live in the repository root, not in tests/.
# `pythonpath = .` makes them importable no matter how pytest is invoked.
# Without it, `pytest` (the bare script, as CI runs it) fails with
# "ModuleNotFoundError: No module named 'calculator'", because unlike
# `python -m pytest` it does not put the current directory on sys.path.
pythonpath = .
testpaths = tests
addopts = -q
